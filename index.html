<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="main.js" defer></script>
    <title>Tic-Tac-Toe</title>
  </head>
  <body>
    <div class="game-container">
      <div class="board">
        <div class="row">
          <div class="square one"></div>
          <div class="square two"></div>
          <div class="square three"></div>
        </div>
        <div class="row">
          <div class="square four"></div>
          <div class="square five"></div>
          <div class="square six"></div>
        </div>
        <div class="row">
          <div class="square seven"></div>
          <div class="square eight"></div>
          <div class="square nine"></div>
        </div>
      </div>

      <div class="controls">
        <div class="btn new-game-btn">New Game</div>
        <div class="btn reset-btn">Reset</div>
      </div>

      <div class="output">
        <p class="msg-output"></p>
      </div>
    </div>

    <dialog id="setup-game">
      <div class="dialog-header">New Game</div>
      <form class="setup-form" action="">
        <div>
          <label for="player-one">Player one's name</label>
          <input class="player-one" name="player-one" type="text" />
        </div>
        <div>
          <label for="player-two">Player two's name</label>
          <input class="player-two" name="player-two" type="text" />
        </div>
        <div>
          <button class="btn submit-btn">Begin game</button>
          <button class="btn cancel-btn">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
